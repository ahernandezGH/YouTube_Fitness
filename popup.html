<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Entrenamientos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <h2>Mis Entrenamientos</h2>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="themeToggleBtn" style="background: none; border: 1px solid var(--card-border); border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--text-title);" title="Cambiar tema"><span id="themeIcon">🌙</span></button>
      <button id="refreshBtn">Actualizar</button>
    </div>
  </div>

  <div id="activeTabAlert" style="display: none; background-color: rgba(66, 133, 244, 0.1); border-left: 3px solid #4285f4; padding: 10px; margin: 10px 15px; border-radius: 4px; font-size: 13px; align-items: center; justify-content: space-between;">
    <span style="flex: 1;">Video de YouTube detectado. Puedes guardarlo en tu biblioteca.</span>
    <button id="saveActiveTabBtn" style="padding: 6px 10px; font-size: 12px; margin-left: 10px; background-color: #4285f4; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: 600;">Guardar</button>
  </div>

  <div class="tabs">
    <button id="feedTabBtn" class="tab-btn active">Feed</button>
    <button id="libraryTabBtn" class="tab-btn">Mi Biblioteca</button>
  </div>
  
  <div class="filters">
    <select id="typeFilter">
      <option value="all">Todos los tipos</option>
      <option value="upper">Tren Superior</option>
      <option value="lower">Tren Inferior</option>
      <option value="full">Cuerpo Completo</option>
      <option value="core">Core</option>
      <option value="cardio">Cardio</option>
      <option value="unknown">Otros / Sin clasificar</option>
    </select>
    
    <select id="levelFilter">
      <option value="all">Todos los niveles</option>
      <option value="basic">Básico</option>
      <option value="intermediate">Intermedio</option>
      <option value="advanced">Avanzado</option>
    </select>
    
    <select id="channelFilter">
      <option value="all">Todos los canales</option>
    <div id="presetFilterContainer" style="display: none; width: 100%; margin-top: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
        <label for="presetFilterSelect" style="font-size: 11px; color: #8b949e;">Filtro Guardado:</label>
        <button type="button" id="saveCurrentFilterBtn" style="font-size: 10px; padding: 0; background: none; border: none; color: var(--primary-color); cursor: pointer; font-weight: 600;">+ Guardar actual</button>
      </div>
      <select id="presetFilterSelect" style="width: 100%; font-size: 12px; padding: 6px 8px;">
        <option value="">Personalizado / Manual</option>
      </select>
    </div>

    <div class="multi-select-group" id="customTagFilterContainer" style="display: none; width: 100%; margin-top: 4px;">
      <div class="multi-select-dropdown" id="includeTagsDropdown">
        <button type="button" class="multi-select-btn" id="includeTagsBtn">
          <span class="multi-select-label" id="includeTagsLabel">Todas las etiquetas</span>
          <span class="multi-select-arrow">▾</span>
        </button>
        <div class="multi-select-menu" id="includeTagsMenu" style="display: none;">
          <div class="multi-select-actions">
            <button type="button" class="multi-select-action-btn" id="selectAllIncludeTagsBtn">Todas</button>
            <button type="button" class="multi-select-action-btn" id="clearIncludeTagsBtn">Limpiar</button>
          </div>
          <div class="multi-select-options" id="includeTagsOptionsList"></div>
        </div>
      </div>
    </div>

    <div class="multi-select-group" id="excludeTagFilterContainer" style="display: none; width: 100%; margin-top: 4px;">
      <div class="multi-select-dropdown" id="excludeTagsDropdown">
        <button type="button" class="multi-select-btn" id="excludeTagsBtn">
          <span class="multi-select-label" id="excludeTagsLabel">Ninguna (no excluir)</span>
          <span class="multi-select-arrow">▾</span>
        </button>
        <div class="multi-select-menu" id="excludeTagsMenu" style="display: none;">
          <div class="multi-select-actions">
            <button type="button" class="multi-select-action-btn danger-action" id="clearExcludeTagsBtn">Ninguna</button>
          </div>
          <div class="multi-select-options" id="excludeTagsOptionsList"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="addVideoForm" style="display: none; gap: 8px; margin-bottom: 15px; padding: 10px; background-color: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid var(--card-border); align-items: center;">
    <input type="text" id="videoUrlInput" placeholder="Pega la URL de un video o Playlist..." style="flex: 1; padding: 6px 10px; font-size: 12px; margin: 0;">
    <button id="addVideoUrlBtn" style="padding: 8px 12px; font-size: 12px; font-weight: 600;">Añadir</button>
  </div>

  <div id="videoList" class="video-list">
    </div>

  <script src="popup.js"></script>
</body>
</html>
